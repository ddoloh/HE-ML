version: "3.7"

services:
  he-ml-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: he_ml_app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
      - VECTOR_DIM=32
      - SCALE=1000000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
